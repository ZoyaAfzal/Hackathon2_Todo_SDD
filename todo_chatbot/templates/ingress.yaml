{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "todo-chatbot.fullname" . }}
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Backend API routes - /api/* -> backend:8000 (no rewrite, backend expects /api prefix)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "todo-chatbot.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.service.port }}
          # Health check route -> backend:8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "todo-chatbot.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.service.port }}
          # Frontend catch-all - /* -> frontend:3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "todo-chatbot.frontend.fullname" . }}
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
